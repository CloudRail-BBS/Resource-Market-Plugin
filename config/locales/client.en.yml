# 注意：本文件刻意填入中文，而不是英文。
#
# Discourse 只会加载与站点当前语言匹配的语言文件。如果只提供
# `client.zh_CN.yml`，那么把语言设为英文的论坛仍然会显示英文文案（甚至原始
# 键名）。为了让资源中心在任何语言的站点上都显示中文，`en` 这个兜底文件也
# 使用同样的中文文案。
#
# 需要重新支持英文时，从 git 历史里取回本文件的英文版本即可（见上一个提交）。
#
# 键名必须与 client.zh_CN.yml 完全一致 —— 缺失的键会回退到本文件。
en:
  admin_js:
    admin:
      site_settings:
        categories:
          # Must match the top-level key in config/settings.yml. Do NOT override
          # core's `plugins` category — that relabels Discourse's own heading.
          resource_hub: "资源中心"
  js:
    resource_hub:
      title: "资源中心"
      nav_title: "资源"

      # `tabs.<名称>` 和 `empty.<名称>` 是按当前标签动态拼出键名的，
      # 所以每一种取值都必须存在。
      tabs:
        all: "全部"
        files: "文件"
        repositories: "仓库"
        mine: "我的上传"

      search:
        placeholder: "搜索资源…"

      sort:
        newest: "最新"
        popular: "下载最多"
        name: "名称"

      actions:
        upload: "上传资源"
        download: "下载"
        link_repo: "关联此仓库"
        sync: "立即同步"
        delete: "删除"
        cancel: "取消"
        visit: "在 GitHub 上查看"
        load_more: "加载更多"

      form:
        title: "上传资源"
        name: "名称"
        name_placeholder: "例如：Discourse 数据浏览插件"
        description: "简介"
        description_placeholder: "这个资源是做什么用的？"
        category: "分类"
        version: "版本"
        tags: "标签"
        tags_placeholder: "用英文逗号分隔多个标签"
        file: "文件"
        drop_hint: "把文件拖到这里，或点击选择"
        remove_file: "移除文件"
        repo_url: "GitHub 仓库"
        repo_placeholder: "https://github.com/owner/repo"
        submit: "发布资源"

      types:
        file: "文件"
        repository: "仓库"

      fields:
        version: "版本"
        downloads: "下载次数"
        uploaded_by: "上传者"

      status:
        pending: "待审核"
        rejected: "已拒绝"

      empty:
        all: "资源中心还是空的，来做第一个分享者吧！"
        files: "还没有人上传文件。"
        repositories: "还没有关联任何 GitHub 仓库。"
        mine: "你还没有上传过任何资源。"

      errors:
        generic: "出了点问题，请重试。"
        title_required: "请填写名称。"
        file_required: "请选择要上传的文件。"
        repo_required: "请填写 GitHub 仓库。"
        upload_failed: "上传失败：%{message}"
        github_failed: "无法连接 GitHub：%{message}"
        forbidden: "你没有权限执行此操作。"

      comments:
        title: "评论"
        placeholder: "写下你的评论…"
        submit: "发表评论"
        empty: "还没有评论。"
        delete: "删除评论"
        confirm_delete: "确定要删除这条评论吗？"

      confirm_delete: "确定要删除这个资源吗？此操作无法撤销。"

      repo:
        releases: "发布版本"
        no_releases: "该仓库还没有发布过版本。"
